# Local development stack.
#
# The worker is a separate container on purpose: a research run or a suite can take
# minutes, and an HTTP worker must never be held open for that long. Set JOB_BACKEND=inline
# to run everything in-process instead (useful for a single-node demo).

name: finagent-lab

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: finagent
      POSTGRES_PASSWORD: finagent
      POSTGRES_DB: finagent
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finagent -d finagent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://finagent:finagent@postgres:5432/finagent
      REDIS_URL: redis://redis:6379/0
      JOB_BACKEND: celery
      SECRET_KEY: ${SECRET_KEY:-dev-only-insecure-secret-change-me}
      WEB_ORIGIN: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      # Provider credentials are read from the host environment and are never baked into
      # an image. Absent credentials mean the provider reports itself unavailable.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      POLYGON_API_KEY: ${POLYGON_API_KEY:-}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}
    ports:
      - "8000:8000"
    volumes:
      - api-storage:/srv/storage
    command:
      - sh
      - -c
      - "cd /srv/apps/api && alembic upgrade head && cd /srv && uvicorn finagent_api.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.api
    depends_on:
      api:
        condition: service_started
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://finagent:finagent@postgres:5432/finagent
      REDIS_URL: redis://redis:6379/0
      JOB_BACKEND: celery
      SECRET_KEY: ${SECRET_KEY:-dev-only-insecure-secret-change-me}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      POLYGON_API_KEY: ${POLYGON_API_KEY:-}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}
    volumes:
      - api-storage:/srv/storage
    # Memory is capped because the worker is what runs sandboxed analysis code.
    mem_limit: 2g
    pids_limit: 512
    command:
      - celery
      - -A
      - finagent_api.jobs.celery_app:celery_app
      - worker
      - --loglevel=info
      - --concurrency=2

  web:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.web
    depends_on:
      api:
        condition: service_started
    environment:
      # Server-side only. The browser never receives this and never calls the API directly.
      FINAGENT_API_URL: http://api:8000
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  api-storage:
