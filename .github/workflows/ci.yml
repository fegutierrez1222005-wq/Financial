name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python — lint, test, migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install \
            ./packages/core \
            ./services/agent-runner \
            ./services/evaluation-engine \
            ./services/backtesting-engine \
            ./services/data-ingestion \
            ./apps/api
          # Pinned: a new ruff release adds rules to existing groups, and CI must not
          # start failing on code nobody touched.
          pip install pytest httpx 'ruff==0.17.0'

      - name: Lint
        run: ruff check apps packages services tests

      - name: Verify the Alembic baseline applies
        env:
          DATABASE_URL: sqlite:///./ci-migration-check.db
          SECRET_KEY: ci-only-secret-key-not-for-production
        run: cd apps/api && alembic upgrade head && rm -f ci-migration-check.db

      # The seven critical controls run first and on their own, so a failure there is
      # unambiguous in the log rather than buried in the full suite.
      - name: Critical security controls
        run: python -m pytest tests/security -v

      - name: Full test suite
        run: python -m pytest

  postgres:
    name: Python — the production dialect
    runs-on: ubuntu-latest
    # SQLite is enough for correctness, but dialect-specific defects only appear here:
    # a missing vector comparator that silently degraded similarity search to a
    # sequential scan, and a non-finite metric that SQLite accepts and JSONB rejects.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: finagent
          POSTGRES_PASSWORD: finagent
          POSTGRES_DB: finagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finagent -d finagent"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install \
            ./packages/core \
            ./services/agent-runner \
            ./services/evaluation-engine \
            ./services/backtesting-engine \
            ./services/data-ingestion \
            './apps/api[postgres]'
          pip install pytest httpx

      - name: Apply the migration to a real PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://finagent:finagent@localhost:5432/finagent
          SECRET_KEY: ci-only-secret-key-not-for-production
        run: cd apps/api && alembic upgrade head

      - name: Assert the vector column and its index exist
        env:
          PGPASSWORD: finagent
        run: |
          psql -h localhost -U finagent -d finagent -tAc "
            SELECT format_type(a.atttypid, a.atttypmod)
            FROM pg_attribute a JOIN pg_class c ON c.oid = a.attrelid
            WHERE c.relname='document_chunks' AND a.attname='embedding'
          " | grep -q 'vector(1536)'
          psql -h localhost -U finagent -d finagent -tAc "
            SELECT 1 FROM pg_indexes WHERE indexname='ix_document_chunks_embedding_hnsw'
          " | grep -q 1

      - name: Full test suite on PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+psycopg://finagent:finagent@localhost:5432/finagent
        run: python -m pytest

  web:
    name: Web — typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  images:
    name: Container images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.api
          push: false
      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.web
          push: false
