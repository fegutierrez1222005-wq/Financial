[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finagent-api"
version = "0.1.0"
description = "FINAGENT LAB API: tenancy, persistence, authorisation and HTTP surface"
requires-python = ">=3.11"
dependencies = [
    "finagent-core",
    "finagent-agent-runner",
    "finagent-evaluation",
    "finagent-backtesting",
    "finagent-ingestion",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "email-validator>=2.1",
    "bcrypt>=4.1",
    "cryptography>=42.0",
    "PyJWT>=2.8",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1", "pgvector>=0.2.5"]
worker = ["celery>=5.3", "redis>=5.0"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4"]

[project.scripts]
finagent = "finagent_api.cli:main"

[tool.setuptools.packages.find]
include = ["finagent_api*"]
