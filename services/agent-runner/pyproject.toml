[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finagent-agent-runner"
version = "0.1.0"
description = "Agent execution loop, controlled tool registry and multi-agent orchestration"
requires-python = ">=3.11"
dependencies = [
    "finagent-core",
    "finagent-backtesting",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["finagent_agent_runner*"]

[tool.setuptools.package-data]
finagent_agent_runner = ["*.tmpl"]
