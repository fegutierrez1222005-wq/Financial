[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finagent-evaluation"
version = "0.1.0"
description = "Evaluation engine: claim extraction, citation verification, evaluators and scoring"
requires-python = ">=3.11"
dependencies = [
    "finagent-core",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["finagent_evaluation*"]
